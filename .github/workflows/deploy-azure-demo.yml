name: Deploy ClinicCare to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliniccare-azure-test
  cancel-in-progress: false

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
  backend:
    uses: ./.github/workflows/backend.yml
  api-contract:
    uses: ./.github/workflows/api-contract.yml

  deploy:
    if: github.repository == 'Samie32/SE-project' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [frontend, backend, api-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy verified commit
        shell: bash
        env:
          BREVO_SMTP_CONFIG: ${{ secrets.BREVO_SMTP_CONFIG }}
          GOOGLE_OAUTH_CONFIG: ${{ secrets.GOOGLE_OAUTH_CONFIG }}
        run: |
          smtp_updated=0
          google_oauth_updated=0
          location=""
          if [ -n "$BREVO_SMTP_CONFIG" ] || [ -n "$GOOGLE_OAUTH_CONFIG" ]; then
            location="$(az vm show --resource-group rg-cliniccare --name vm-cliniccare-azure-test \
              --query location -o tsv --only-show-errors)"
          fi
          if [ -n "$BREVO_SMTP_CONFIG" ]; then
            smtp_script="$(printf '%s\n' '#!/bin/sh' "python3 - store <<'PY'"; cat scripts/run-with-azure-smtp.py; printf '\nPY\n')"
            command=(--resource-group rg-cliniccare --vm-name vm-cliniccare-azure-test --name cliniccare-sync-smtp)
            if ! smtp_error="$(az vm run-command create "${command[@]}" --location "$location" --async-execution false \
              --parameters "CLINICCARE_SYNC_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --script "$smtp_script" --protected-parameters "BREVO_SMTP_CONFIG=$BREVO_SMTP_CONFIG" \
              --only-show-errors --output none 2>&1)"; then
              # CLI errors can include input arguments. Report only recognized error codes.
              case "$smtp_error" in
                *AuthorizationFailed*)
                  echo '::error::Azure AuthorizationFailed. Grant the deployment identity Microsoft.Compute/virtualMachines/runCommands/read and Microsoft.Compute/virtualMachines/runCommands/write at the VM scope.' ;;
                *OperationNotAllowed*|*VMNotRunning*|*VMDeallocated*)
                  echo '::error::Azure rejected the operation. Check that the demo VM is running and its agent is ready.' ;;
                *"unrecognized arguments"*)
                  echo '::error::Azure CLI rejected the Managed Run Command arguments.' ;;
                *)
                  echo '::error::Azure could not create the Managed Run Command. See the VM or resource group Activity Log for operation details.' ;;
              esac
              exit 1
            fi
            smtp_status="$(az vm run-command show "${command[@]}" --instance-view \
              --query instanceView.output -o tsv --only-show-errors)"
            case "$smtp_status" in
              CLINICCARE_SMTP_UPDATED) smtp_updated=1 ;;
              CLINICCARE_SMTP_UNCHANGED) ;;
              *) echo 'VM did not confirm SMTP configuration. Check the format of BREVO_SMTP_CONFIG.' >&2; exit 1 ;;
            esac
          fi
          if [ -n "$GOOGLE_OAUTH_CONFIG" ]; then
            google_b64="$(printf '%s' "$GOOGLE_OAUTH_CONFIG" | base64 -w0)"
            google_script="$(printf '%s\n' '#!/bin/sh' "python3 - store <<'PY'"; cat scripts/run-with-azure-google-oauth.py; printf '\nPY\n')"
            command=(--resource-group rg-cliniccare --vm-name vm-cliniccare-azure-test --name cliniccare-sync-google-oauth)
            if ! google_error="$(az vm run-command create "${command[@]}" --location "$location" --async-execution false \
              --parameters "CLINICCARE_SYNC_RUN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --script "$google_script" --protected-parameters "GOOGLE_OAUTH_CONFIG_B64=$google_b64" \
              --only-show-errors --output none 2>&1)"; then
              case "$google_error" in
                *AuthorizationFailed*)
                  echo '::error::Azure AuthorizationFailed. Grant the deployment identity Microsoft.Compute/virtualMachines/runCommands/read and Microsoft.Compute/virtualMachines/runCommands/write at the VM scope.' ;;
                *OperationNotAllowed*|*VMNotRunning*|*VMDeallocated*)
                  echo '::error::Azure rejected the operation. Check that the demo VM is running and its agent is ready.' ;;
                *"unrecognized arguments"*)
                  echo '::error::Azure CLI rejected the Managed Run Command arguments.' ;;
                *)
                  echo '::error::Azure could not create the Managed Run Command. See the VM or resource group Activity Log for operation details.' ;;
              esac
              exit 1
            fi
            google_status="$(az vm run-command show "${command[@]}" --instance-view \
              --query instanceView.output -o tsv --only-show-errors | tr -d '\r')"
            case "$google_status" in
              CLINICCARE_GOOGLE_OAUTH_UPDATED) google_oauth_updated=1 ;;
              CLINICCARE_GOOGLE_OAUTH_UNCHANGED) ;;
              CLINICCARE_GOOGLE_OAUTH_ERROR:*)
                echo "VM rejected GOOGLE_OAUTH_CONFIG (${google_status#CLINICCARE_GOOGLE_OAUTH_ERROR:})." >&2
                exit 1 ;;
              *)
                echo 'VM did not confirm Google OAuth configuration. Check the format of GOOGLE_OAUTH_CONFIG.' >&2
                exit 1 ;;
            esac
          fi
          script="$RUNNER_TEMP/cliniccare-deploy.sh"
          printf 'DEPLOY_SHA=%s\n' "$GITHUB_SHA" > "$script"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$smtp_updated" = 1 ] || [ "$google_oauth_updated" = 1 ]; then
            printf 'DEPLOY_FORCE_FULL=1\n' >> "$script"
          fi
          cat scripts/deploy-azure-demo.sh >> "$script"

          output="$(az vm run-command invoke \
            --resource-group rg-cliniccare \
            --name vm-cliniccare-azure-test \
            --command-id RunShellScript \
            --scripts "@$script" \
            --query 'value[].message' -o tsv)"
          printf '%s\n' "$output"
          grep -Fxq "CLINICCARE_DEPLOY_OK $GITHUB_SHA" <<< "$output" ||
            grep -Fxq "CLINICCARE_DEPLOY_SUPERSEDED $GITHUB_SHA" <<< "$output"

  post-deploy-smoke:
    if: github.repository == 'Samie32/SE-project' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live Azure demo endpoints and security headers
        run: python3 scripts/verify-live-demo.py --summary-md "$GITHUB_STEP_SUMMARY"

name: Patient frontend
on:
  push:
    paths: ['frontend/frontend_patient/**', '.github/workflows/patient-frontend.yml', 'compose.yaml']
  pull_request:
    paths: ['frontend/frontend_patient/**', '.github/workflows/patient-frontend.yml', 'compose.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/frontend_patient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/frontend_patient/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build frontend image
        run: docker build -t cliniccare-patient .

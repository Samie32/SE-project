name: API contract
on:
  workflow_call:
  push:
    branches-ignore: [main]
    paths:
      - 'docs/api/**'
      - 'scripts/check-api-contract.py'
      - 'scripts/requirements-api-contract.txt'
      - 'scripts/tests/test_api_contract.py'
      - '.github/workflows/api-contract.yml'
  pull_request:
    paths:
      - 'docs/api/**'
      - 'scripts/check-api-contract.py'
      - 'scripts/requirements-api-contract.txt'
      - 'scripts/tests/test_api_contract.py'
      - '.github/workflows/api-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-api-contract.txt
      - run: python -m pip install -r scripts/requirements-api-contract.txt
      - run: python scripts/check-api-contract.py
      - run: python -B -m unittest discover -s scripts/tests -v

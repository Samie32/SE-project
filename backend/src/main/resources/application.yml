spring:
  application:
    name: clinic-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/clinic?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${DB_POOL_MAX:30}
  flyway:
    user: ${MIGRATION_USER:${DB_USER:clinic}}
    password: ${MIGRATION_PASSWORD:${DB_PASSWORD}}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.ssl.checkserveridentity: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
clinic:
  mail-from: ${SMTP_FROM:clinic@example.test}
  staff-admin-base: ${OIDC_ADMIN_BASE:http://localhost:8180}
  staff-client-secret: ${KEYCLOAK_STAFF_CLIENT_SECRET:}
  issuer: ${OIDC_ISSUER:http://localhost:8180/realms/clinic}
  jwks: ${OIDC_JWKS:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}
  audience: clinic-api
  cors: ${FRONTEND_ORIGIN:http://localhost:5173}
  encryption-key: ${DATA_ENCRYPTION_KEY}
  notifications-enabled: ${NOTIFICATIONS_ENABLED:true}
  contact-otp-required: ${CONTACT_OTP_REQUIRED:true}
  audit:
    hot-retention-days: ${AUDIT_HOT_RETENTION_DAYS:365}
    archive-retention-days: ${AUDIT_ARCHIVE_RETENTION_DAYS:1825}
    export-max-rows: ${AUDIT_EXPORT_MAX_ROWS:5000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs:
    version: OPENAPI_3_1

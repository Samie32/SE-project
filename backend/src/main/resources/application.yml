spring:
  application:
    name: clinic-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/clinic?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    user: ${MIGRATION_USER:${DB_USER:clinic}}
    password: ${MIGRATION_PASSWORD:${DB_PASSWORD}}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
clinic:
  issuer: ${OIDC_ISSUER:http://localhost:8180/realms/clinic}
  jwks: ${OIDC_JWKS:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}
  audience: clinic-api
  cors: ${FRONTEND_ORIGIN:http://localhost:5173}
  encryption-key: ${DATA_ENCRYPTION_KEY}
  notifications-enabled: ${NOTIFICATIONS_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs:
    version: OPENAPI_3_1

openapi: 3.1.0
info:
  title: ClinicCare BE–FE Integration Contract
  version: 1.0.0
  description: Hợp đồng tích hợp chốt ngày 16/11/2026. Đây là chuẩn BE/FE phải tuân thủ, không phải tuyên bố backend
    đã đạt mọi điều kiện. Xem integration-contract.md và integration-backlog.md. openapi.json là snapshot sinh từ
    backend, không phải nguồn chuẩn thay thế YAML này.
servers:
- url: http://localhost:8080/api
  description: Local API; FE proxy /api tại cổng 5173
security:
- bearerAuth: []
paths:
  /clinic/hours:
    get:
      tags: [M03]
      operationId: clinicHours
      summary: Đọc giờ hoạt động của phòng khám
      x-access: Tài khoản đã xác thực
      x-requirements: [FR-02]
      responses:
        '200':
          description: Giờ hoạt động hằng tuần theo giờ Việt Nam
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyHours'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [M03]
      operationId: updateClinicHours
      summary: Cập nhật giờ hoạt động của phòng khám
      x-access: ADMINISTRATOR
      x-requirements: [FR-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyHours'
      responses:
        '200':
          description: Giờ mới đã được lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /clinic/holidays:
    get:
      tags: [M03]
      operationId: clinicHolidays
      summary: Đọc danh sách ngày nghỉ lễ và lịch đặc biệt của phòng khám
      x-access: Tài khoản đã xác thực
      x-requirements: [FR-02]
      responses:
        '200':
          description: Danh sách ngày nghỉ lễ và khung giờ đặc biệt theo ngày Việt Nam
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [M03]
      operationId: addClinicHoliday
      summary: Thêm ngày nghỉ lễ hoặc lịch hoạt động đặc biệt
      x-access: ADMINISTRATOR
      x-requirements: [FR-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayInput'
      responses:
        '200':
          description: Ngày nghỉ lễ đã được lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /clinic/holidays/{id}:
    delete:
      tags: [M03]
      operationId: removeClinicHoliday
      summary: Xóa ngày nghỉ lễ hoặc lịch hoạt động đặc biệt
      x-access: ADMINISTRATOR
      x-requirements: [FR-02]
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Đã xóa ngày nghỉ lễ
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments:
    get:
      tags:
      - M04
      operationId: listAppointments
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: listAppointments
      description: 'Quyền mục tiêu: PATIENT của mình/DOCTOR được gán/RECEPTIONIST/ADMINISTRATOR. Xem integration-contract.md
        cho cửa sổ thời gian, giao dịch và phân quyền tài nguyên.'
      x-requirements:
      - FR-02
      - FR-08
      x-access: PATIENT của mình/DOCTOR được gán/RECEPTIONIST/ADMINISTRATOR
    post:
      tags:
      - M04
      operationId: bookAppointment
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
        required: true
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: bookAppointment
      description: 'Quyền mục tiêu: PATIENT tự đặt. Xem integration-contract.md cho cửa sổ thời gian, giao dịch
        và phân quyền tài nguyên.'
      x-requirements:
      - FR-08
      x-access: PATIENT tự đặt
  /appointments/{id}:
    get:
      tags:
      - M04
      operationId: getAppointment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: getAppointment
      description: 'Quyền mục tiêu: Chủ lịch/DOCTOR được gán/RECEPTIONIST/ADMINISTRATOR. Xem integration-contract.md
        cho cửa sổ thời gian, giao dịch và phân quyền tài nguyên.'
      x-requirements:
      - FR-02
      - FR-11
      x-access: Chủ lịch/DOCTOR được gán/RECEPTIONIST/ADMINISTRATOR
  /appointments/{id}/cancel:
    post:
      tags:
      - M04
      operationId: cancelAppointment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancel'
        required: true
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: cancelAppointment
      description: 'Quyền mục tiêu: PATIENT chủ lịch. Xem integration-contract.md cho cửa sổ thời gian, giao dịch
        và phân quyền tài nguyên.'
      x-requirements:
      - FR-10
      x-access: PATIENT chủ lịch
  /appointments/{id}/check-in:
    post:
      tags:
      - M08
      operationId: checkIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTicket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: checkIn
      description: 'Quyền mục tiêu: RECEPTIONIST. Xem integration-contract.md cho cửa sổ thời gian, giao dịch và
        phân quyền tài nguyên.'
      x-requirements:
      - FR-19
      x-access: RECEPTIONIST
  /appointments/{id}/delay-notice:
    post:
      tags: [M06]
      operationId: sendDelayNotice
      summary: Đưa email báo chậm giờ vào hàng đợi
      x-access: RECEPTIONIST
      x-requirements: [FR-25]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelayNotice'
      responses:
        '200':
          description: Tác vụ báo chậm đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelayNoticeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /appointments/{id}/progress:
    post:
      tags:
      - M04
      operationId: progressAppointment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Progress'
        required: true
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: progressAppointment
      description: 'Quyền mục tiêu: DOCTOR được gán; NO_SHOW trực tiếp: RECEPTIONIST. Xem integration-contract.md
        cho cửa sổ thời gian, giao dịch và phân quyền tài nguyên.'
      x-requirements:
      - FR-11
      - FR-26
      x-access: 'DOCTOR được gán; NO_SHOW trực tiếp: RECEPTIONIST'
  /appointments/{id}/reschedule:
    post:
      tags:
      - M04
      operationId: rescheduleAppointment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reschedule'
        required: true
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: rescheduleAppointment
      description: 'Quyền mục tiêu: PATIENT chủ lịch. Xem integration-contract.md cho cửa sổ thời gian, giao dịch
        và phân quyền tài nguyên.'
      x-requirements:
      - FR-09
      x-access: PATIENT chủ lịch
  /appointments/{id}/telehealth-session:
    get:
      tags:
      - M09
      operationId: readByAppointment
      summary: Đọc phiên khám từ xa theo lịch hẹn
      description: Đọc cả phiên đã kết thúc hoặc hủy. Trả 404 nếu chưa có phiên hoặc người gọi không thuộc lịch hẹn.
      x-requirements:
      - FR-22
      x-access: PATIENT chủ lịch/DOCTOR phụ trách
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Trạng thái hiện tại của phiên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelehealthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - M09
      operationId: prepareSession
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
        description: Bắt buộc; giữ nguyên khi retry cùng thao tác/payload trong 24 giờ.
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelehealthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: prepareSession
      description: 'Quyền mục tiêu: PATIENT chủ lịch/DOCTOR phụ trách. Xem integration-contract.md cho cửa sổ thời
        gian, giao dịch và phân quyền tài nguyên. Prepare một lần khi vào phòng; không dùng để poll. ENDED/CANCELLED
        trả 409.'
      x-requirements:
      - FR-22
      x-access: PATIENT chủ lịch/DOCTOR phụ trách
  /audit-events:
    get:
      tags:
      - M07
      operationId: listAuditEvents
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: result
        in: query
        required: false
        schema:
          type: string
          enum:
          - SUCCESS
          - DENIED
          - FAILURE
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACCESS_CONTROL
          - CLINICAL
          - APPOINTMENT
          - TELEHEALTH
          - CATALOG
          - NOTIFICATION
          - AUDIT
      - name: actorType
        in: query
        required: false
        schema:
          type: string
          enum:
          - USER
          - SYSTEM
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: excludeReadNoise
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: cursorCreatedAt
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: cursorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: listAuditEvents
      description: 'Quyền mục tiêu: AUDITOR. Hỗ trợ lọc server-side (result, action theo mã/tiền tố/từ khóa tiếng Việt, category, actorType, correlationId, excludeReadNoise), nhãn tác nhân an toàn không lộ PII/PHI và phân trang con trỏ (cursorCreatedAt + cursorId) chống trôi trang khi AUDIT_SEARCH ghi thêm.'
      x-requirements:
      - FR-17
      - FR-18

openapi: 3.1.0
info:
  title: Clinic Telehealth API
  version: 0.1.0
  description: Course project API design. OAuth2/OIDC Authorization Code with PKCE;
    bearer access token stored in client memory. Resource authorization is required.
    External services are represented by provider adapters.

          type: string
          minLength: 1
          maxLength: 200
          description: Định danh public client clinic-wpf, không phải secret
      required:
      - grant_type
      additionalProperties: false
      allOf:
      - if:
          properties:
            grant_type:
              const: authorization_code
        then:
          required:
          - code
          - redirect_uri
          - code_verifier
      - if:
          properties:
            grant_type:
              const: refresh_token
        then:
          required:
          - refresh_token

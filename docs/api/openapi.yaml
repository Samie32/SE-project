          maxLength: 1024
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]{43,128}$
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096

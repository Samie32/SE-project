  /telehealth-sessions/{sessionId}/end:
    post:
      operationId: endSession
      summary: End media and revoke admission; clinical finalization is separate
      x-requirements:
      - FR-24
      description: >-
        Assigned doctor ends ACTIVE or RECONNECTING with version validation. Atomically persist ENDED, audit and a durable room-closure task. Deny new tokens immediately; retry provider closure until acknowledged. Clinical finalization and encounter completion remain separate.

  /telehealth-sessions/{sessionId}/start:
    post:
      operationId: startSession
      summary: Assigned doctor activates consultation
      x-requirements:
      - FR-23
      description: >-
        Assigned doctor starts a WAITING session with an admitted patient during [start, start + 15 minutes). Validate version; atomically set ACTIVE, appointment IN_PROGRESS, create Encounter and audit. Returns Session; call joinSession separately for a token.
      responses:
        '200':
          description: Successful authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':

      - systemEvents
      - chainedEvents
      - legacyUnchainedEvents
      - latestEventAt
      example:
        totalEvents: 48
        deniedEvents: 2
        failureEvents: 0
        accessControlEvents: 6
        recordAmendedEvents: 1
        systemEvents: 5
        chainedEvents: 48
        legacyUnchainedEvents: 0
        latestEventAt: '2030-01-08T02:00:00Z'

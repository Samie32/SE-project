            application/json:
              schema:
                $ref: '#/components/schemas/PatientAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags:
      - M01
      operationId: listUsers
      parameters:
      - name: q
        in: query
        required: false
        description: Tìm tài khoản theo một phần username hoặc tên hiển thị, không phân biệt hoa thường.
        schema:
          type: string
          maxLength: 255
      - name: role
        in: query
        schema:
          type: string
          enum: [DOCTOR, RECEPTIONIST, ADMINISTRATOR, AUDITOR, UNASSIGNED]
      - name: active
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Thành công
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: Danh sách tài khoản nhân sự
      description: Chỉ trả tài khoản đã được đưa vào nhóm nhân sự trong ClinicCare.
      x-requirements:
      - FR-02
      x-access: ADMINISTRATOR
  /users/{id}/roles:
    put:
      tags:
      - M01
      operationId: setRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Roles'
        required: true
      responses:
        '200':
          description: Thành công; HTTP 200, body rỗng (PUT contact/roles).
          headers:
            X-Request-Id:
              description: Mã liên kết request/audit; baseline có thể thiếu trên lỗi security filter.
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: setRoles
      description: 'Quyền mục tiêu: ADMINISTRATOR; không tự đổi quyền. Xem integration-contract.md cho cửa sổ thời
        gian, giao dịch và phân quyền tài nguyên.'
      x-requirements:
      - FR-02
      - FR-17
      x-access: ADMINISTRATOR; không tự đổi quyền
  /staff:
    post:
      tags: [M01]
      operationId: createStaff
      summary: Thêm tài khoản nhân sự
      description: Liên kết định danh Keycloak thuộc realm của ứng dụng. Tài khoản mới chờ cấp vai trò.
      x-requirements: [FR-02, FR-17]
      x-access: ADMINISTRATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Staff'
      responses:
        '201':
          description: Đã thêm nhân sự hoặc định danh đã liên kết trước đó.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /staff/provision:
    post:
      tags: [M01]
      operationId: provisionStaff
      summary: Tạo tài khoản và cấp quyền nhân sự
      x-requirements: [FR-02, FR-17]
      x-access: ADMINISTRATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaff'
      responses:
        '201':
          description: Đã tạo tài khoản Keycloak, tài khoản ClinicCare và các vai trò đã chọn.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /staff/{id}:
    put:
      tags: [M01]
      operationId: updateStaff
      summary: Cập nhật họ tên và trạng thái trong ClinicCare
      x-requirements: [FR-02, FR-17]
      x-access: ADMINISTRATOR
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: Đã cập nhật. Body rỗng.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  schemas:
    NewStaff:
      type: object
      required: [username, displayName, email, temporaryPassword, roles, specialtyIds]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'}
        displayName: {type: string, minLength: 1, maxLength: 120}
        email: {type: string, format: email, maxLength: 254}
        temporaryPassword: {type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [DOCTOR, RECEPTIONIST, ADMINISTRATOR, AUDITOR]}
        specialtyIds:
          type: array
          description: Chuyên khoa bắt buộc khi cấp vai trò Bác sĩ và rỗng với các vai trò khác.
          items: {type: string, format: uuid}
    Staff:
      type: object
      required: [subject, username, displayName]
      properties:
        subject: {type: string, format: uuid}
        username: {type: string, minLength: 1, maxLength: 255}
        displayName: {type: string, minLength: 1, maxLength: 255}
    StaffUpdate:
      type: object
      required: [displayName, active]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 255}
        active: {type: boolean}
    WeeklyHours:
      type: object
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Mỗi thứ xuất hiện một lần, từ thứ Hai đến Chủ nhật.
          items:
            $ref: '#/components/schemas/DayHours'
    DayHours:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Thứ Hai là 1. Chủ nhật là 7.
        opensAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Giờ mở cửa ở định dạng HH:mm. Ngày nghỉ dùng null cho cả hai giờ.
        closesAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Giờ đóng cửa ở định dạng HH:mm và phải sau giờ mở cửa trong cùng ngày.
    HolidayInput:
      type: object
      required: [startDate, endDate, name, closed]
      properties:
        startDate:
          type: string
          format: date
          description: Ngày bắt đầu áp dụng theo YYYY-MM-DD (giờ Việt Nam).
        endDate:
          type: string
          format: date
          description: Ngày kết thúc áp dụng (từ startDate trở đi).
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Tên dịp lễ hoặc lý do thay đổi lịch.
        closed:
          type: boolean
          description: true nếu nghỉ cả ngày; false nếu mở theo khung giờ đặc biệt.
        opensAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Giờ mở cửa đặc biệt (HH:mm) khi closed=false; gửi null khi closed=true.
        closesAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Giờ đóng cửa đặc biệt (HH:mm) khi closed=false; phải sau opensAt.
      example:
        startDate: '2026-09-02'
        endDate: '2026-09-02'
        name: Nghỉ lễ Quốc khánh
        closed: true
        opensAt: null
        closesAt: null
    Holiday:
      type: object
      required: [id, startDate, endDate, name, closed, opensAt, closesAt]
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        name:
          type: string
        closed:
          type: boolean
        opensAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        closesAt:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
      example:
        id: 11111111-1111-1111-1111-111111111111
        startDate: '2026-09-02'
        endDate: '2026-09-02'
        name: Nghỉ lễ Quốc khánh
        closed: true
        opensAt: null
        closesAt: null
    Role:
      type: string
      enum:
      - PATIENT
      - DOCTOR
      - RECEPTIONIST
      - ADMINISTRATOR
      - AUDITOR
    AppointmentMode:
      type: string
      enum:
      - IN_PERSON
      - REMOTE
    AppointmentStatus:
      type: string
      enum:
      - CONFIRMED
      - CHECKED_IN
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
    QueueStatus:
      type: string
      enum:
      - WAITING
      - CALLED
      - IN_SERVICE
      - DONE
    SessionStatus:
      type: string
      enum:
      - CREATED
      - WAITING
      - ACTIVE
      - RECONNECTING
      - ENDED
      - CANCELLED
    DbBoolean:
      oneOf:
      - type: boolean
      - type: integer
        enum:
        - 0
        - 1
      description: Chuẩn hóa ở adapter FE thành boolean. Không dùng Boolean("0").
    Identity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
      required:
      - id
      - roles
      example:
        id: 00000000-0000-4000-8000-000000000001
        roles:
        - PATIENT
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type:
          - string
          - 'null'
          maxLength: 255
        displayName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        active:
          $ref: '#/components/schemas/DbBoolean'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
        patientId:
          type:
          - string
          - 'null'
          format: uuid
        doctorId:
          type:
          - string
          - 'null'
          format: uuid
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
          pattern: '^0(3|5|7|8|9)[0-9]{8}$'
        birthDate:
          type:
          - string
          - 'null'
          format: date
        hometown:
          type:
          - string
          - 'null'
          maxLength: 255
        permanentAddress:
          type:
          - string
          - 'null'
          maxLength: 255
        personalInfoUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
        personalInfoNextEditAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - displayName
      - active
      - roles
      - patientId
      - doctorId
      example:
        id: 00000000-0000-4000-8000-000000000001
        username: patient
        displayName: Bệnh nhân mô phỏng
        active: true
        roles:
        - PATIENT
        patientId: 00000000-0000-4000-8000-000000000001
        doctorId: null
        email: patient@example.test
        phone: '0901234567'
        birthDate: '1998-04-20'
        hometown: Nghệ An
        permanentAddress: Quận 7, TP.HCM
        personalInfoUpdatedAt: null
        personalInfoNextEditAt: null
    PersonalProfile:
      type: object
      properties:
        birthDate:
          type:
          - string
          - 'null'
          pattern: '^$|^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
        hometown:
          type:
          - string
          - 'null'
          maxLength: 255
        permanentAddress:
          type:
          - string
          - 'null'
          maxLength: 255
      example:
        birthDate: '1998-04-20'
        hometown: Nghệ An
        permanentAddress: Quận 7, TP.HCM
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        username:
          type: [string, 'null']
          maxLength: 255
          description: Username đã đồng bộ từ tài khoản đăng nhập.
        doctorId:
          type: [string, 'null']
          format: uuid
          description: ID hồ sơ bác sĩ nếu tài khoản đã có hồ sơ.
        active:
          $ref: '#/components/schemas/DbBoolean'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true
      required:
      - id
      - displayName
      - active
      - roles
      - username
      - doctorId
    SpecialtyView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        active:
          $ref: '#/components/schemas/DbBoolean'
      required:
      - id
      - name
      - active
      example:
        id: 00000000-0000-4000-8000-000000000001
        name: Nội tổng quát
        active: true
    DoctorRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active:
          $ref: '#/components/schemas/DbBoolean'
        displayName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        specialtyId:
          type: string
          format: uuid
      required:
      - id
      - active
      - displayName
      - specialtyId
      description: GET /doctors trả một dòng trên mỗi chuyên khoa; FE nhóm theo id. Không có userId trong danh sách.
    DoctorView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        active:
          $ref: '#/components/schemas/DbBoolean'
      required:
      - id
      - userId
      - active
      description: Response tạo/sửa bác sĩ là bản ghi doctor, không phải DoctorRow của danh sách.
    AvailabilityView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        slotMinutes:
          type: integer
          minimum: 1
          maximum: 540
        mode:
          $ref: '#/components/schemas/AppointmentMode'
      required:
      - id
      - doctorId
      - startAt
      - endAt
      - slotMinutes
      - mode
    TimeOffView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      required:
      - id
      - doctorId
      - startAt
      - endAt
    SlotView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        availabilityId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/AppointmentMode'
      required:
      - id
      - availabilityId
      - doctorId
      - startAt
      - endAt
      - mode
    AppointmentView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/AppointmentMode'
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        version:
          type: integer
          minimum: 0
        cancellationReason:
          type:
          - string
          - 'null'
          maxLength: 1000
        noShowReason:
          type: [string, 'null']
          enum: [PATIENT_ABSENT, COULD_NOT_CONTACT, TECHNICAL_ISSUE, OTHER, null]
          description: Chỉ trả cho nhân viên có quyền trên lịch.
      required:
      - id
      - patientId
      - doctorId
      - slotId
      - startAt
      - endAt
      - mode
      - status
      - version
      - cancellationReason
      example:
        id: 00000000-0000-4000-8000-000000000001
        patientId: 00000000-0000-4000-8000-000000000001
        doctorId: 00000000-0000-4000-8000-000000000002
        slotId: 00000000-0000-4000-8000-000000000002
        startAt: '2030-01-08T02:00:00Z'
        endAt: '2030-01-08T02:20:00Z'
        mode: IN_PERSON
        status: CONFIRMED
        version: 0
        cancellationReason: null
      description: Danh sách và đặt/đổi/hủy không cam kết encounterId. Không suy ra encounterId từ appointmentId.
    AppointmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/AppointmentMode'
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        version:
          type: integer
          minimum: 0
        cancellationReason:
          type:
          - string
          - 'null'
          maxLength: 1000
        encounterId:
          type:
          - string
          - 'null'
          format: uuid
        noShowReason:
          type: [string, 'null']
          enum: [PATIENT_ABSENT, COULD_NOT_CONTACT, TECHNICAL_ISSUE, OTHER, null]
          description: Chỉ trả cho nhân viên có quyền trên lịch.
      required:
      - id
      - patientId
      - doctorId
      - slotId
      - startAt
      - endAt
      - mode
      - status
      - version
      - cancellationReason
      - encounterId
      example:
        id: 00000000-0000-4000-8000-000000000001
        patientId: 00000000-0000-4000-8000-000000000001
        doctorId: 00000000-0000-4000-8000-000000000002
        slotId: 00000000-0000-4000-8000-000000000002
        startAt: '2030-01-08T02:00:00Z'
        endAt: '2030-01-08T02:20:00Z'
        mode: IN_PERSON
        status: CONFIRMED
        version: 0
        cancellationReason: null
        encounterId: null
      description: GET detail và progress trả encounterId; null trước khi bắt đầu khám.
    QueueTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        queueDate:
          type: string
          format: date
        position:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/QueueStatus'
        version:
          type: integer
          minimum: 0
        skipReason:
          type:
          - string
          - 'null'
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        patientId:
          type: string
          format: uuid
      required:
      - id
      - appointmentId
      - doctorId
      - queueDate
      - position
      - status
      - version
      - skipReason
      - createdAt
      example:
        id: 00000000-0000-4000-8000-000000000001
        appointmentId: 00000000-0000-4000-8000-000000000002
        doctorId: 00000000-0000-4000-8000-000000000002
        queueDate: '2030-01-08'
        position: 1
        status: WAITING
        version: 0
        skipReason: null
        createdAt: '2030-01-08T02:00:00Z'
      description: patientId chỉ có trong GET queue. createdAt là lúc check-in; không có checkedInAt. version phải
        dùng khi skip.
    MedicalRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string

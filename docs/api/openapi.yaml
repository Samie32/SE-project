        maxRows: 5000
        truncated: false
        contentSha256: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
        csv: "\uFEFFSTT chuỗi,Mã sự kiện (UUID),Thời điểm (UTC)\r\n1,00000000-0000-4000-8000-000000000001,2030-01-08T02:00:00Z\r\n"

          minimum: 0
        failureEvents:
          type: integer
          minimum: 0
        accessControlEvents:
          type: integer
          minimum: 0
        recordAmendedEvents:
          type: integer
          minimum: 0
        systemEvents:
          type: integer
          minimum: 0
        chainedEvents:
          type: integer
          minimum: 0
        legacyUnchainedEvents:
          type: integer
          minimum: 0
        latestEventAt:

                $ref: '#/components/schemas/Error'
              example:
                code: AUDIT_UNAVAILABLE
                message: Audit/DB/provider không khả dụng
                request_id: 20000000-0000-4000-8000-000000000001
      x-fr:
      - FR-01.2
      x-use-cases:
      - UC-02
      x-roles: PUBLIC
      x-entities:
      - app_users
      x-error-policy: GET ngoài scope404; rolebịcấm403; không token401; response sạch khôngPHI; auditPHI trước trả
        và cùng mutation.
      servers:
      - url: https://clinic-demo.example.com
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Đổi authorization code + PKCE cho native public client
      description: Public client clinic-wpf đổi code bằng PKCE S256; redirect_uri phải giống hoàn toàn request authorize,
        không client_secret; làm mới refresh token theo rotation. Access token Bearer truyền qua HTTPS; refresh token
        lưu bằng DPAPI CurrentUser. Ví dụ 49152 là cổng mẫu, không được hardcode.
      tags:
      - Tài khoản xác thực và phân quyền
      security: []
      parameters: []
      responses:
        '200':
          description: Thành công đã commit; metadata hoặc dữ liệu đượcphép.
          headers:
            X-Request-Id:
              schema: *id001
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResult'
              example:
                token_type: Bearer
                expires_in: 900
                access_token: Dữ liệu giả phục vụ demo
                refresh_token: Dữ liệu giả phục vụ demo
        '400':
          description: Sai cú pháp; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: Sai cú pháp
                request_id: 20000000-0000-4000-8000-000000000001
        '401':
          description: Chưa xác thực hoặc callback giả; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Chưa xác thực hoặc callback giả
                request_id: 20000000-0000-4000-8000-000000000001
        '403':
          description: Vai trò/trạng thái không đủ quyền; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Vai trò/trạng thái không đủ quyền
                request_id: 20000000-0000-4000-8000-000000000001
        '404':
          description: Không tồn tại hoặc ngoài scope; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Không tồn tại hoặc ngoài scope
                request_id: 20000000-0000-4000-8000-000000000001
        '409':
          description: State/version/idempotency/time conflict; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SLOT_UNAVAILABLE
                message: State/version/idempotency/time conflict
                request_id: 20000000-0000-4000-8000-000000000001
        '422':
          description: Dữ liệu/quy tắc ngưỡng sai; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu/quy tắc ngưỡng sai
                request_id: 20000000-0000-4000-8000-000000000001
        '429':
          description: Vượt giới hạn; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TOO_MANY_REQUESTS
                message: Vượt giới hạn
                request_id: 20000000-0000-4000-8000-000000000001
        '500':
          description: Lỗi nội bộ; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Lỗi nội bộ
                request_id: 20000000-0000-4000-8000-000000000001
        '503':
          description: Audit/DB/provider không khả dụng; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUDIT_UNAVAILABLE
                message: Audit/DB/provider không khả dụng
                request_id: 20000000-0000-4000-8000-000000000001
      x-fr:
      - FR-01.2
      - FR-01.6
      x-use-cases:
      - UC-02
      x-roles: OAUTHCLIENT
      x-entities:
      - app_users
      x-error-policy: GET ngoài scope404; rolebịcấm403; không token401; response sạch khôngPHI; auditPHI trước trả
        và cùng mutation.
      servers:
      - url: https://clinic-demo.example.com
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            example:
              grant_type: authorization_code
              code: demo-one-time-code
              redirect_uri: http://127.0.0.1:49152/callback
              code_verifier: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              client_id: clinic-wpf
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags:
      - Tài khoản xác thực và phân quyền
      summary: Thu hồi token theo OAuth2 (native public client)
      description: Ứng dụng clinic-wpf gửi refresh token khi logout. Public client không có client_secret; xác thực/ràng
        buộc client, token và audit server-side theo chính sách provider. 200 được phép trả cả khi token đã bị thu
        hồi (tránh leak). Cần thực hiện và kiểm thử bằng OpenIddict thật.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              - client_id
              properties:
                token:
                  type: string
                  minLength: 1
                token_type_hint:
                  type: string
                  enum:
                  - refresh_token
                  - access_token
                client_id:
                  type: string
                  const: clinic-wpf
            example:
              token: DEMO_TOKEN_NOT_REAL
              token_type_hint: refresh_token
              client_id: clinic-wpf
      responses:
        '200':
          description: Yêu cầu thu hồi được xử lý; không tiết lộ token có tồn tại.
        '400':
          description: Yêu cầu không hợp lệ; không echo token.
      x-fr:
      - FR-01.7
      x-use-cases:
      - UC-25
      x-roles: OAUTHCLIENT
      x-entities:
      - app_users

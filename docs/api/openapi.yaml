components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from OAuth2/OIDC. Re-authenticate after expiration.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
    Identity:
      type: object
      additionalProperties: false
      required:
      - id
      - roles
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum:
            - PATIENT
            - DOCTOR
            - RECEPTIONIST
            - ADMIN
            - AUDITOR
    Doctor:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - specialtyIds
      - active
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        specialtyIds:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
    DoctorInput:
      type: object
      additionalProperties: false
      required:
      - displayName
      - specialtyIds
      - active
      properties:
        displayName:
          type: string
          minLength: 1
        specialtyIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        active:
          type: boolean
    Specialty:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    Availability:
      type: object
      additionalProperties: false
      required:
      - id
      - doctorId
      - startAt
      - endAt
      - slotMinutes
      - mode
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        slotMinutes:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - IN_PERSON
          - TELEHEALTH
    AvailabilityInput:
      type: object
      additionalProperties: false
      required:
      - startAt
      - endAt
      - slotMinutes
      - mode
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        slotMinutes:
          type: integer
          minimum: 1
        mode:
          type: string
          enum:
          - IN_PERSON
          - TELEHEALTH
    TimeOff:
      type: object
      additionalProperties: false
      required:
      - id
      - doctorId
      - startAt
      - endAt
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
    Slot:
      type: object
      additionalProperties: false
      required:
      - id
      - doctorId
      - startAt
      - endAt
      - mode
      properties:
        id:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        mode:
          type: string
          enum:
          - IN_PERSON
          - TELEHEALTH
    Appointment:
      type: object
      additionalProperties: false
      required:
      - id
      - patientId
      - doctorId
      - slotId
      - status
      - mode
      - version
      - encounterId
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CONFIRMED
          - CHECKED_IN
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        mode:
          type: string
          enum:
          - IN_PERSON
          - TELEHEALTH
        version:
          type: integer
          minimum: 0
        encounterId:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when consultation starts; null before encounter creation.
    BookingInput:
      type: object
      additionalProperties: false
      required:
      - slotId
      properties:
        slotId:
          type: string
          format: uuid
    RescheduleInput:
      type: object
      additionalProperties: false
      required:
      - slotId
      - version
      properties:
        slotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
    CancelInput:
      type: object
      additionalProperties: false
      required:
      - reason
      - version
      properties:
        reason:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 0
    ProgressInput:
      type: object
      additionalProperties: false
      required:
      - targetStatus
      - version
      properties:
        targetStatus:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
          - NO_SHOW
        version:
          type: integer
          minimum: 0
    Record:
      type: object
      additionalProperties: false
      required:
      - id
      - encounterId
      - version
      - status
      - content
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - DRAFT
          - FINAL
        content:
          type: string
    RecordInput:
      type: object
      additionalProperties: false
      required:
      - version
      - content
      - status
      properties:
        version:
          type: integer
          minimum: 0
        content:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - DRAFT
          - FINAL
    PrescriptionItem:
      type: object
      additionalProperties: false
      required:
      - medicineName
      - doseText
      - route
      - frequency
      - durationText
      properties:
        medicineName:
          type: string
          minLength: 1
        doseText:
          type: string
          minLength: 1
        route:
          type: string
          minLength: 1
        frequency:
          type: string
          minLength: 1
        durationText:
          type: string
          minLength: 1
    Prescription:
      type: object
      additionalProperties: false
      required:
      - id
      - encounterId
      - status
      - version
      - items
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - ISSUED
        version:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
    PrescriptionInput:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
    QueueTicket:
      type: object
      additionalProperties: false
      required:
      - id
      - appointmentId
      - position
      - status
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - WAITING
          - CALLED
          - IN_SERVICE
          - DONE
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - appointmentId
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - CREATED
          - WAITING
          - ACTIVE
          - RECONNECTING
          - ENDED
          - CANCELLED
        version:
          type: integer
          minimum: 0
    JoinToken:
      type: object
      additionalProperties: false
      required:
      - sessionId
      - token
      - expiresAt
      properties:
        sessionId:
          type: string
          format: uuid
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    Notification:
      type: object
      additionalProperties: false
      required:
      - id
      - appointmentId
      - channel
      - status
      - attempts
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - EMAIL
          - SMS
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - DELIVERED
          - FAILED
          - SKIPPED
        attempts:
          type: integer
          minimum: 0
    Audit:
      type: object
      additionalProperties: false
      required:
      - id
      - actorId
      - action
      - resourceId
      - timestamp
      - result
      - correlationId
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        action:
          type: string
        resourceId:
          type: string
        timestamp:
          type: string
          format: date-time
        result:
          type: string
        correlationId:
          type: string

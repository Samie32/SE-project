openapi: 3.1.1
info:
  title: Topic 2 Outpatient Clinic API
  version: 2.3.0
  description: 'Hợp đồng ASP.NET Core API cho ứng dụng Windows desktop WPF .NET 10. WPF là OAuth2 public client: Authorization
    Code + PKCE S256 trên trình duyệt hệ thống, callback loopback HTTP 127.0.0.1 cổng động do app lắng nghe, đổi code
    tại OAuth token endpoint; client_id=clinic-wpf, không client_secret. Ứng dụng không gửi username/password trực
    tiếp đến API nghiệp vụ. API nghiệp vụ chỉ dùng HTTPS Bearer (không cookie/CSRF). Form đăng nhập chạy tại identity
    host trong browser ngoài phạm vi hợp đồng API này. Server thực thi RBAC, owner, doctor, branch, audit PHI. Ba
    endpoint authentication kiểu web cũ đã được gỡ khỏi hợp đồng v2.3; migration history được ghi trong RTM. Ví dụ/example
    URL chỉ là giả lập, chưa có instance production.'
servers:
- url: https://clinic-demo.example.com/api/v1
  description: URL minh họa hợp đồng; thay bằng domain triển khai trong cấu hình runtime
security:
- OAuth2:
  - clinic
tags:
- name: Tài khoản xác thực và phân quyền
- name: Quản lý hồ sơ bệnh nhân
- name: Quản lý bác sĩ chuyên khoa và lịch làm việc
- name: Đặt lịch đổi lịch và hủy lịch
- name: Tiếp nhận và quản lý lượt khám
- name: Khám bệnh bệnh án và đơn thuốc điện tử
- name: Khám bệnh từ xa qua video
- name: Xác nhận và nhắc lịch SMS Email
- name: Bảo mật và nhật ký truy cập bệnh án
paths:
  /auth/register:
    post:
      operationId: register
      summary: Đăng ký tài khoản
      description: Thực thi quyền máy chủ, validate dữ liệu và giữ trạng thái trước thao tác khi thất bại.
      tags:
      - Tài khoản xác thực và phân quyền
      security: []
      parameters: []
      responses:
        '201':
          description: Thành công đã commit; metadata hoặc dữ liệu đượcphép.
          headers:
            X-Request-Id:
              schema: &id001
                type: string
                format: uuid
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Dữ liệu giả phục vụ demo
                request_id: 10000000-0000-4000-8000-000000000001
        '400':
          description: Sai cú pháp; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BAD_REQUEST
                message: Sai cú pháp
                request_id: 20000000-0000-4000-8000-000000000001
        '401':
          description: Chưa xác thực hoặc callback giả; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Chưa xác thực hoặc callback giả
                request_id: 20000000-0000-4000-8000-000000000001
        '403':
          description: Vai trò/trạng thái không đủ quyền; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Vai trò/trạng thái không đủ quyền
                request_id: 20000000-0000-4000-8000-000000000001
        '404':
          description: Không tồn tại hoặc ngoài scope; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Không tồn tại hoặc ngoài scope
                request_id: 20000000-0000-4000-8000-000000000001
        '409':
          description: State/version/idempotency/time conflict; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SLOT_UNAVAILABLE
                message: State/version/idempotency/time conflict
                request_id: 20000000-0000-4000-8000-000000000001
        '422':
          description: Dữ liệu/quy tắc ngưỡng sai; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Dữ liệu/quy tắc ngưỡng sai
                request_id: 20000000-0000-4000-8000-000000000001
        '429':
          description: Vượt giới hạn; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: TOO_MANY_REQUESTS
                message: Vượt giới hạn
                request_id: 20000000-0000-4000-8000-000000000001
        '500':
          description: Lỗi nội bộ; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INTERNAL_ERROR
                message: Lỗi nội bộ
                request_id: 20000000-0000-4000-8000-000000000001
        '503':
          description: Audit/DB/provider không khả dụng; không echo PHI hoặc secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: AUDIT_UNAVAILABLE
                message: Audit/DB/provider không khả dụng
                request_id: 20000000-0000-4000-8000-000000000001
      x-fr:
      - FR-01.1
      x-use-cases:
      - UC-01
      x-roles: PUBLIC
      x-entities:
      - app_users
      x-error-policy: GET ngoài scope404; rolebịcấm403; không token401; response sạch khôngPHI; auditPHI trước trả
        và cùng mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            example:
              email: demo.patient@example.com
              name: Dữ liệu giả
              password: DemoPassword2026!

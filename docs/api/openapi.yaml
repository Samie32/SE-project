  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      summary: OAuth2 code authorization với PKCE
      description: WPF native public client clinic-wpf mở system browser tới HTTPS identity-hosted authorization endpoint;
        code_challenge S256, state ngẫu nhiên, client_id và redirect_uri dạng http://127.0.0.1:<cổng_động>/callback.
        App chỉ bind loopback 127.0.0.1 và kiểm tra state + PKCE; phải spike khả năng allowlist cổng động của OpenIddict.
        Identity-hosted sign-in có thể dùng session bảo mật nội bộ trong browser nhưng KHÔNG trả cookie làm xác thực
        API nghiệp vụ.
      tags:
      - Tài khoản xác thực và phân quyền
      security: []
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          const: code
      - name: client_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          const: clinic-wpf
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: 'Mẫu hợp lệ: http://127.0.0.1:49152/callback; cổng thực tế sinh động và kiểm soát tại auth server.'
      - name: scope
        in: query
        required: true
        schema:
          type: string
          const: clinic
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 128
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
